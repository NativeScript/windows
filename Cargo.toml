[workspace]
resolver = "2"
members = ["metadata", "metadata-filter", "playground", "runtime", "runtime-binding-gen", "sbg", "nativescript", "typings-generator", "integration-tests", "runtime-devtools", "metadata-generator","tools/dotnet-tool", "windows-napi", "napi-v8-shim"]
# Excluded so their C builds / prebuilt-engine links don't run on normal `cargo` invocations.
exclude = ["packages/common", "packages/demo", "packages/windows-quickjs", "packages/windows-hermes", "packages/windows-jsc", "packages/windows-v8"]

[workspace.dependencies]
windows = "0.62.2"

[profile.dev]
debug = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
debug = false
incremental = false
strip = true

# Release build with development tools and SBG (Static Binding Generator)
[profile.release-with-devtools]
inherits = "release"

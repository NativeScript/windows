[package]
name = "sbg"
version = "0.1.0"
edition = "2021"
description = "Static Binding Generator - Pre-build phase for generating WinRT proxy assemblies"

[[bin]]
name = "sbg"
path = "src/main.rs"

[dependencies]
regex = "1.10"
anyhow = "1.0"
metadata = { path = "../metadata" }
metadata-filter = { path = "../metadata-filter" }
tokio = { version = "1.40", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"

[dependencies.windows]
workspace = true
features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_System_Com",
]

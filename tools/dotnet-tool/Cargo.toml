[package]
name = "dotnet-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
metadata-filter = { path = "../../metadata-filter" }
oxc_allocator = "0.133"
oxc_parser = "0.133"
oxc_ast = "0.133"
oxc_span = "0.133"

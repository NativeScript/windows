[package]
name = "windows-hermes"
version = "0.1.0"
edition = "2021"
description = "NativeScript Windows runtime on Microsoft's prebuilt Hermes. Publishes as @nativescript/windows-hermes."

# `cdylib` so `build.ps1 -Engine hermes` can emit `nativescript.dll` (the WinUI 3 host DLL);
# `rlib` so the standalone `nativescript-windows` bin can link the shared FFI + bring-up.
[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "nativescript-windows"
path = "src/main.rs"

[features]
# `icu` defaults on: the smaller `uwp/x64` build it trades in for has no package identity, so it
# fails to load in the standalone `nativescript-windows` bin (STATUS_DLL_NOT_FOUND: confirmed, not
# hypothetical; see vendor/README.md). Build with `--no-default-features` only for an MSIX-packaged
# `host_dll` target where that's verified to work.
default = ["icu"]
# Compile the `nativescript.dll` C ABI (src/abi.rs) into the cdylib so the WinUI 3 host can load
# Hermes as a drop-in replacement for the classic runtime. Selected by `build.ps1 -Engine hermes`.
# All deps are already unconditional, so this only toggles the abi/host modules on.
host_dll = []
# On by default: vendors the `win32/x64` Hermes build + bundled `hermes-icu.dll` (~36 MB of ICU
# data), which works everywhere. Disable (`--no-default-features`) to vendor the smaller `uwp/x64`
# build instead, which uses the OS's built-in ICU and ships no separate ICU DLL.
icu = []

[dependencies]
runtime = { path = "../../runtime", default-features = false, features = ["napi_engine", "module_runner"] }
napi = { version = "2", default-features = false, features = ["napi8"] }
# Shared JS prelude + URL polyfill: used by both the cdylib (abi.rs) and the demo bin (main.rs).
ns-windows-common = { path = "../common" }
# Crash reporter + self-test harness for the demo bin (main.rs) only.
ns-windows-demo = { path = "../demo" }

# Windows-port fix so napi_* resolve from THIS cdylib (nativescript.dll) when loaded by the WinUI 3
# .NET host, not from the host .exe (which has no napi exports). See packages/vendor/napi-sys.
# (Hermes' napi_* live in hermes.dll; the cdylib forward-exports them, so the probe resolves here.)
[patch.crates-io]
napi-sys = { path = "../vendor/napi-sys" }

# The crash reporter symbolizes native frames from the release build's PDB.
[profile.release]
debug = true

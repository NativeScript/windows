[package]
name = "windows-quickjs"
version = "0.1.0"
edition = "2021"
description = "NativeScript Windows runtime on embedded QuickJS (quickjs-ng + napi-android node_api shim). Publishes as @nativescript/windows-quickjs."

# `cdylib` so `build.ps1 -Engine quickjs` can emit `nativescript.dll` (the WinUI 3 host DLL);
# `rlib` so the standalone `nativescript-windows` bin can still link the crate.
[lib]
crate-type = ["rlib", "cdylib"]

# The standalone runtime executable. Needs the napi shim (napi_shim), so it's the default feature.
[[bin]]
name = "nativescript-windows"
path = "src/main.rs"
required-features = ["napi_shim"]

[features]
default = ["napi_shim"]
# Compile the napi-android node_api shim (quickjs-api.c + jsr.cpp) over quickjs-ng and pull in the
# runtime host stack. Without it, only the engine smoke lib builds (no napi / no v8).
napi_shim = ["dep:napi", "dep:runtime", "dep:ns-windows-common", "dep:ns-windows-demo"]
# Compile the `nativescript.dll` C ABI (src/abi.rs) into the cdylib so the WinUI 3 host can load
# QuickJS as a drop-in replacement for the classic runtime. Selected by `build.ps1 -Engine quickjs`.
host_dll = ["napi_shim"]

[dependencies]
# napi-rs: its `Env` operates against the shim's napi_env (Env::from_raw).
napi = { version = "2", default-features = false, features = ["napi8"], optional = true }
runtime = { path = "../../runtime", features = ["napi_engine", "module_runner"], optional = true }
# Shared JS prelude + URL polyfill: used by both the cdylib (abi.rs) and the demo bin (main.rs).
ns-windows-common = { path = "../common", optional = true }
# Crash reporter + self-test harness for the demo bin (main.rs) only: never linked into the cdylib.
ns-windows-demo = { path = "../demo", optional = true }

[build-dependencies]
cc = "1"

# Windows-port fix so napi_* resolve from THIS cdylib (nativescript.dll) when loaded by the WinUI 3
# .NET host, not from the host .exe (which has no napi exports). See packages/vendor/napi-sys.
[patch.crates-io]
napi-sys = { path = "../vendor/napi-sys" }

# The crash reporter symbolizes shim/native frames from the release build's PDB.
[profile.release]
debug = true

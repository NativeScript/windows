[package]
name = "runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
mimalloc = "0.1"
ahash = "0.8"
byteorder = "1.5"
regex = "1.10"
anyhow = "1.0"
libffi = "5.1.0"
# The classic engine (`classic` feature). The napi engines build without it and never link V8.
v8 = { version = "147", optional = true }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"
form_urlencoded = "1"
metadata = { path = "../metadata" }
runtime-binding-gen = { path = "../runtime-binding-gen" }
parking_lot = "0.12"
libc = "0.2"
runtime-devtools = { path = "../runtime-devtools", optional = true }
# Node-API backend (napi_engine feature). Off by default so the rusty_v8 build is unaffected.
napi = { version = "2", default-features = false, features = ["napi8"], optional = true }
# The `module_runner` feature's ES module transform. Pinned: 0.146+ needs a newer rustc than the
# toolchain here.
oxc = { version = "=0.145.0", default-features = false, features = ["semantic", "codegen"], optional = true }
oxc_transformer_plugins = { version = "=0.145.0", optional = true }
# Native crash reporter (napi_engine hosts): symbolize SEH faults via the host PDB.
backtrace = "0.3"
aes-gcm = "0.10"
getrandom = "0.2"

windows-core = "0.62.2"
windows-collections = "0.3.2"

[dependencies.windows]
workspace = true
features = [
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_EventLog",
    "Win32_Security",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WindowsProgramming",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "System",
    "Storage_Streams",
    "Data_Json",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_System_WinRT_Composition",
    "Foundation_Numerics",
    "Graphics_Imaging",
]

[features]
default = ["classic"]
# The classic engine: WinRT interop written against rusty_v8, which `nativescript.dll` is built on.
# The napi engine packages turn default features off, so they don't compile or link V8.
classic = ["dep:v8"]
devtools = ["classic", "runtime-devtools"]
napi_engine = ["dep:napi"]
# ES modules for napi engines without a native module loader (QuickJS, Hermes, JSC): modules are
# transformed to async functions and run by a JS module runner (napi_engine::module_runner).
module_runner = ["napi_engine", "dep:oxc", "dep:oxc_transformer_plugins"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "sync_runtime"
harness = false

[[bench]]
name = "async_runtime"
harness = false

[[bin]]
name = "nsbundle_pack"
path = "src/bin/nsbundle_pack.rs"